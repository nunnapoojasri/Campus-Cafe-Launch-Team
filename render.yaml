services:
  - type: web
    name: campus-cafe-launch-team
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-demo.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_DEMO_MODE
        value: "true"
